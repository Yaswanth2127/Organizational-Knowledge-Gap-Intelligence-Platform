services:
  postgres:
    image: postgres:18
    container_name: okgip-postgres
    environment:
      POSTGRES_DB: okgip_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - okgip-network

  redis:
    image: redis:latest
    container_name: okgip-redis
    ports:
      - "6379:6379"
    networks:
      - okgip-network

  backend:
    image: okgip-backend:latest
    container_name: okgip-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/okgip_platform
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis
    networks:
      - okgip-network
  frontend:
    image: okgip-frontend:latest
    container_name: okgip-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - okgip-network

volumes:
  postgres_data:
    external: true
    name: okgip_postgres_data

networks:
  okgip-network: